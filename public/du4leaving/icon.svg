    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 红黑装饰条 (catchzvibe / Rodchenko 构成主义风) -->
  <rect x="64" y="92" width="180" height="14" fill="#c1272d"/>
